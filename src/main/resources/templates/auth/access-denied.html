<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="UTF-8">
  <title>STB — Accès refusé</title>
  <link rel="stylesheet" th:href="@{/css/stb.css}">
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)">
  <div style="text-align:center;max-width:460px;padding:40px">
    <div style="font-size:80px;font-weight:900;color:var(--border);line-height:1;margin-bottom:8px">403</div>
    <div style="font-size:52px;margin-bottom:16px">🚫</div>
    <h2 style="font-size:24px;font-weight:800;color:var(--navy);margin-bottom:10px">Accès refusé</h2>
    <p style="font-size:14px;color:var(--text3);line-height:1.7;margin-bottom:28px">
      Vous n'avez pas les droits nécessaires pour accéder à cette ressource.<br>
      Contactez votre administrateur système STB.
    </p>
    <div style="display:flex;gap:10px;justify-content:center">
      <a href="/dashboard" class="btn btn-primary">← Tableau de bord</a>
      <form th:action="@{/perform-logout}" method="post" style="display:inline">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-ghost">Se déconnecter</button>
      </form>
    </div>
  </div>
</body>
</html>
