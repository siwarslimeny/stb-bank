<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>STB — Employés</title>
  <link rel="stylesheet" th:href="@{/css/stb.css}">
</head>
<body>
<div class="app-layout">
  <div th:replace="~{fragments :: sidebar(activePage='employes', user=${user})}"></div>
  <div class="app-main">
    <div th:replace="~{fragments :: topbar(pageTitle='Service Ressources Humaines', user=${user})}"></div>
    <div class="page-body">
      <div th:replace="~{fragments :: alerts}"></div>

      <div class="pg-hdr">
        <div>
          <div class="pg-title">Service Ressources Humaines</div>
          <div class="pg-sub">Gestion du personnel STB</div>
        </div>
        <a th:href="@{/employes/nouveau}" class="btn btn-primary">＋ Ajouter un employé</a>
      </div>

      <div class="stats-row">
        <div class="stat-card sc-purple">
          <div class="si si-purple">👥</div>
          <div class="stat-val" th:text="${count}">0</div>
          <div class="stat-lbl">Total employés</div>
        </div>
        <div class="stat-card sc-green">
          <div class="si si-green">✅</div>
          <div class="stat-val" th:text="${employes.size()}">0</div>
          <div class="stat-lbl">En activité</div>
        </div>
        <div class="stat-card sc-amber">
          <div class="si si-amber">💰</div>
          <div class="stat-val" th:text="${#numbers.formatDecimal(avgSalaire,1,'COMMA',0,'POINT')}">0</div>
          <div class="stat-lbl">Salaire moyen DT</div>
        </div>
        <div class="stat-card sc-navy">
          <div class="si si-navy">🔒</div>
          <div class="stat-lbl" style="margin-top:8px">Accès</div>
          <span class="badge b-purple" style="margin-top:6px">ADMIN · RH</span>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h3>Registre du personnel</h3>
          <span class="card-count" th:text="${employes.size()} + ' employés'"></span>
        </div>
        <div style="padding:12px 20px;border-bottom:1px solid var(--border)">
          <form th:action="@{/employes}" method="get" style="display:flex;gap:10px;align-items:center">
            <div class="search-wrap">
              <span class="search-ico">🔍</span>
              <input type="text" name="q" th:value="${q}"
                     placeholder="Rechercher par nom, poste, matricule…">
            </div>
            <button type="submit" class="btn btn-navy btn-sm">Rechercher</button>
            <a th:href="@{/employes}" class="btn btn-ghost btn-sm">Réinitialiser</a>
          </form>
        </div>
        <div class="tbl-wrap">
          <table th:if="${!#lists.isEmpty(employes)}">
            <thead>
            <tr>
              <th>Matricule</th>
              <th>Nom</th>
              <th>Poste</th>
              <th>Département</th>
              <th>Salaire</th>
              <th>Contrat</th>
              <th>Embauche</th>
              <th>Statut</th>
              <th style="text-align:center">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${employes}">
              <td>
                <code style="font-size:11px;color:var(--text3);background:#F1F5F9;padding:2px 7px;border-radius:5px"
                      th:text="${e.matricule}"></code>
              </td>
              <td>
                <div style="display:flex;align-items:center;gap:9px">
                  <div class="av" style="background:var(--purple-bg);color:var(--purple)"
                       th:text="${e.initiales}">AB</div>
                  <div>
                    <div style="font-weight:600" th:text="${e.nomComplet}"></div>
                    <div style="font-size:11px;color:var(--text3)" th:text="${e.email}"></div>
                  </div>
                </div>
              </td>
              <td style="font-size:13px" th:text="${e.poste}"></td>
              <td>
                <span class="badge b-navy" th:text="${e.departement}"></span>
              </td>
              <td>
                <strong th:text="${#numbers.formatDecimal(e.salaire,1,'COMMA',0,'POINT') + ' DT'}"></strong>
              </td>
              <td>
                  <span th:class="${e.contrat.name() == 'CDI'} ? 'badge b-navy' :
                                   (${e.contrat.name() == 'CDD'} ? 'badge b-warn' : 'badge b-gray')"
                        th:text="${e.contrat}"></span>
              </td>
              <td style="font-size:12px;color:var(--text3)"
                  th:text="${e.dateEmbauche != null ?
                              #temporals.format(e.dateEmbauche,'dd/MM/yyyy') : '—'}"></td>
              <td>
                  <span th:class="${e.statut.name() == 'ACTIF'}    ? 'badge b-ok'   :
                                  (${e.statut.name() == 'CONGE'}   ? 'badge b-warn' :
                                  (${e.statut.name() == 'SUSPENDU'}? 'badge b-err'  : 'badge b-gray'))"
                        th:text="${e.statut}"></span>
              </td>
              <td>
                <div style="display:flex;gap:6px;justify-content:center">
                  <a th:href="@{/employes/{id}/modifier(id=${e.id})}"
                     class="btn-icon" title="Modifier">✏️</a>
                  <form th:action="@{/employes/{id}/supprimer(id=${e.id})}"
                        method="post" style="display:inline"
                        onsubmit="return confirm('Supprimer cet employé ?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn-icon del" title="Supprimer">🗑️</button>
                  </form>
                </div>
              </td>
            </tr>
            </tbody>
          </table>
          <div class="empty" th:if="${#lists.isEmpty(employes)}">
            <div class="empty-icon">👥</div>
            <p>Aucun employé trouvé</p>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
<script>
  function tick(){const e=document.getElementById('clock');if(e)e.textContent=new Date().toLocaleTimeString('fr-FR');}
  setInterval(tick,1000);tick();
</script>
</body>
</html>
