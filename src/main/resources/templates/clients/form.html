<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title th:text="${isNew} ? 'STB — Nouveau client' : 'STB — Modifier client'">STB — Client</title>
  <link rel="stylesheet" th:href="@{/css/stb.css}">
</head>
<body>
<div class="app-layout">
  <div th:replace="~{fragments :: sidebar(activePage='clients', user=${user})}"></div>
  <div class="app-main">
    <div th:replace="~{fragments :: topbar(pageTitle=${isNew} ? 'Nouveau client' : 'Modifier client', user=${user})}"></div>
    <div class="page-body">

      <div class="pg-hdr">
        <div>
          <div class="pg-title" th:text="${isNew} ? 'Ajouter un nouveau client' : 'Modifier le dossier client'">Client</div>
          <div class="pg-sub">Remplissez tous les champs obligatoires (*)</div>
        </div>
        <a th:href="@{/clients}" class="btn btn-ghost">← Retour à la liste</a>
      </div>

      <div class="card form-wrap" style="max-width:780px">
        <div class="card-head">
          <h3 th:text="${isNew} ? '📋 Informations du nouveau client' : '✏️ Modifier — ' + ${client.nomComplet}">Formulaire client</h3>
        </div>
        <div class="card-body">
          <form th:action="${isNew} ? @{/clients/nouveau} : @{/clients/{id}/modifier(id=${client.id})}"
                method="post" th:object="${client}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-grid">
              <!-- Nom -->
              <div class="fg">
                <label>Nom *</label>
                <input type="text" th:field="*{nom}" placeholder="Ben Ali" required>
                <span class="field-err" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></span>
              </div>
              <!-- Prénom -->
              <div class="fg">
                <label>Prénom *</label>
                <input type="text" th:field="*{prenom}" placeholder="Ahmed" required>
                <span class="field-err" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></span>
              </div>
              <!-- Email -->
              <div class="fg">
                <label>Email *</label>
                <input type="email" th:field="*{email}" placeholder="ahmed@mail.tn" required>
                <span class="field-err" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
              </div>
              <!-- Téléphone -->
              <div class="fg">
                <label>Téléphone *</label>
                <input type="text" th:field="*{telephone}" placeholder="22 XXX XXX" required>
                <span class="field-err" th:if="${#fields.hasErrors('telephone')}" th:errors="*{telephone}"></span>
              </div>
              <!-- CIN -->
              <div class="fg">
                <label>CIN / Identifiant</label>
                <input type="text" th:field="*{cin}" placeholder="08 XXX XXX">
              </div>
              <!-- Date naissance -->
              <div class="fg">
                <label>Date de naissance</label>
                <input type="date" th:field="*{dateNaissance}">
              </div>
              <!-- Type client -->
              <div class="fg">
                <label>Type de client *</label>
                <select th:field="*{typeClient}">
                  <option th:each="t : ${T(tn.stb.bank.model.Client.TypeClient).values()}"
                          th:value="${t}" th:text="${t}"></option>
                </select>
              </div>
              <!-- Statut -->
              <div class="fg">
                <label>Statut *</label>
                <select th:field="*{statut}">
                  <option th:each="s : ${T(tn.stb.bank.model.Client.StatutClient).values()}"
                          th:value="${s}" th:text="${s}"></option>
                </select>
              </div>
              <!-- Agence -->
              <div class="fg">
                <label>Agence</label>
                <select th:field="*{agence}">
                  <option value="">-- Sélectionner --</option>
                  <option th:each="a : ${ {'Tunis Centre','La Marsa','Ariana','Sfax','Sousse','Nabeul','Bizerte','Monastir','Gafsa','Gabès'} }"
                          th:value="${a}" th:text="${a}"></option>
                </select>
              </div>
              <!-- Profession -->
              <div class="fg">
                <label>Profession</label>
                <input type="text" th:field="*{profession}" placeholder="Ingénieur, Médecin…">
              </div>
              <!-- Revenu mensuel -->
              <div class="fg">
                <label>Revenu mensuel (DT)</label>
                <input type="number" th:field="*{revenuMensuel}" placeholder="3500" min="0" step="100">
              </div>
              <!-- Adresse -->
              <div class="fg">
                <label>Ville</label>
                <input type="text" th:field="*{ville}" placeholder="Tunis">
              </div>
              <!-- Adresse complète -->
              <div class="fg span2">
                <label>Adresse complète</label>
                <input type="text" th:field="*{adresse}" placeholder="12, Rue de la République, Tunis">
              </div>
            </div>

            <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:24px;padding-top:18px;border-top:1px solid var(--border)">
              <a th:href="@{/clients}" class="btn btn-ghost">Annuler</a>
              <button type="submit" class="btn btn-primary"
                      th:text="${isNew} ? '＋ Créer le client' : '💾 Enregistrer les modifications'">Enregistrer</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>
<script>function tick(){const e=document.getElementById('clock');if(e)e.textContent=new Date().toLocaleTimeString('fr-FR');}setInterval(tick,1000);tick();</script>
</body>
</html>
