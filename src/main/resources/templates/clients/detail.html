<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>STB — Détail client</title>
  <link rel="stylesheet" th:href="@{/css/stb.css}">
</head>
<body>
<div class="app-layout">
  <div th:replace="~{fragments :: sidebar(activePage='clients', user=${user})}"></div>
  <div class="app-main">
    <div th:replace="~{fragments :: topbar(pageTitle='Fiche client', user=${user})}"></div>
    <div class="page-body">

      <div class="pg-hdr">
        <div>
          <div class="pg-title" th:text="${client.nomComplet}">Nom client</div>
          <div class="pg-sub" th:text="'N° ' + ${client.numeroClient} + ' · ' + ${client.agence}"></div>
        </div>
        <div style="display:flex;gap:10px">
          <a th:href="@{/clients/{id}/modifier(id=${client.id})}" class="btn btn-primary">✏️ Modifier</a>
          <a th:href="@{/clients}" class="btn btn-ghost">← Retour</a>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
        <!-- Infos personnelles -->
        <div class="card">
          <div class="card-head"><h3>👤 Informations personnelles</h3></div>
          <div class="card-body">
            <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--border)">
              <div class="av" style="width:52px;height:52px;font-size:18px;background:var(--stb-red-lt);color:var(--stb-red)" th:text="${client.initiales}">AB</div>
              <div>
                <div style="font-size:18px;font-weight:700;color:var(--navy)" th:text="${client.nomComplet}"></div>
                <span th:class="${client.statut.name() == 'ACTIF' ? 'badge b-ok' : client.statut.name() == 'BLOQUE' ? 'badge b-err' : 'badge b-warn'}"
                      th:text="${client.statut}"></span>
              </div>
            </div>
            <table style="width:100%;font-size:13px">
              <tr style="border-bottom:1px solid #F0F3FA">
                <td style="padding:9px 0;color:var(--text3);font-weight:600;width:40%">CIN</td>
                <td style="padding:9px 0" th:text="${client.cin ?: '—'}"></td>
              </tr>
              <tr style="border-bottom:1px solid #F0F3FA">
                <td style="padding:9px 0;color:var(--text3);font-weight:600">Email</td>
                <td style="padding:9px 0" th:text="${client.email}"></td>
              </tr>
              <tr style="border-bottom:1px solid #F0F3FA">
                <td style="padding:9px 0;color:var(--text3);font-weight:600">Téléphone</td>
                <td style="padding:9px 0" th:text="${client.telephone}"></td>
              </tr>
              <tr style="border-bottom:1px solid #F0F3FA">
                <td style="padding:9px 0;color:var(--text3);font-weight:600">Date naissance</td>
                <td style="padding:9px 0" th:text="${client.dateNaissance != null ? #temporals.format(client.dateNaissance, 'dd/MM/yyyy') : '—'}"></td>
              </tr>
              <tr style="border-bottom:1px solid #F0F3FA">
                <td style="padding:9px 0;color:var(--text3);font-weight:600">Profession</td>
                <td style="padding:9px 0" th:text="${client.profession ?: '—'}"></td>
              </tr>
              <tr>
                <td style="padding:9px 0;color:var(--text3);font-weight:600">Adresse</td>
                <td style="padding:9px 0" th:text="${client.adresse != null ? client.adresse + ', ' + client.ville : (client.ville ?: '—')}"></td>
              </tr>
            </table>
          </div>
        </div>

        <!-- Infos bancaires -->
        <div class="card">
          <div class="card-head"><h3>🏦 Informations bancaires</h3></div>
          <div class="card-body">
            <table style="width:100%;font-size:13px">
              <tr style="border-bottom:1px solid #F0F3FA">
                <td style="padding:9px 0;color:var(--text3);font-weight:600;width:40%">N° Client</td>
                <td style="padding:9px 0"><code style="background:#F1F5F9;padding:2px 7px;border-radius:5px;font-size:11px" th:text="${client.numeroClient}"></code></td>
              </tr>
              <tr style="border-bottom:1px solid #F0F3FA">
                <td style="padding:9px 0;color:var(--text3);font-weight:600">Agence</td>
                <td style="padding:9px 0" th:text="${client.agence ?: '—'}"></td>
              </tr>
              <tr style="border-bottom:1px solid #F0F3FA">
                <td style="padding:9px 0;color:var(--text3);font-weight:600">Type client</td>
                <td style="padding:9px 0">
                  <span th:class="${client.typeClient.name() == 'ENTREPRISE' ? 'badge b-navy' : 'badge b-info'}"
                        th:text="${client.typeClient}"></span>
                </td>
              </tr>
              <tr style="border-bottom:1px solid #F0F3FA">
                <td style="padding:9px 0;color:var(--text3);font-weight:600">Revenu mensuel</td>
                <td style="padding:9px 0">
                  <strong th:text="${client.revenuMensuel != null ? #numbers.formatDecimal(client.revenuMensuel,1,'COMMA',0,'POINT') + ' DT' : '—'}"></strong>
                </td>
              </tr>
              <tr>
                <td style="padding:9px 0;color:var(--text3);font-weight:600">Date d'inscription</td>
                <td style="padding:9px 0" th:text="${#temporals.format(client.dateInscription,'dd/MM/yyyy HH:mm')}"></td>
              </tr>
            </table>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="card" style="margin-top:18px">
        <div class="card-head"><h3>Actions</h3></div>
        <div class="card-body" style="display:flex;gap:10px;flex-wrap:wrap">
          <a th:href="@{/clients/{id}/modifier(id=${client.id})}" class="btn btn-primary">✏️ Modifier le dossier</a>
          <a th:href="@{/clients}" class="btn btn-ghost">← Retour à la liste</a>
          <form th:action="@{/clients/{id}/supprimer(id=${client.id})}" method="post"
                onsubmit="return confirm('Supprimer définitivement ce client ?')" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-danger">🗑️ Supprimer</button>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>
<script>function tick(){const e=document.getElementById('clock');if(e)e.textContent=new Date().toLocaleTimeString('fr-FR');}setInterval(tick,1000);tick();</script>
</body>
</html>
