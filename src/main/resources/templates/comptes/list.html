<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head><meta charset="UTF-8"><title>STB — Comptes</title>
<link rel="stylesheet" th:href="@{/css/stb.css}"></head>
<body>
<div class="app-layout">
  <div th:replace="~{fragments :: sidebar(activePage='comptes', user=${user})}"></div>
  <div class="app-main">
    <div th:replace="~{fragments :: topbar(pageTitle='Comptes Bancaires', user=${user})}"></div>
    <div class="page-body">
      <div th:replace="~{fragments :: alerts}"></div>
      <div class="pg-hdr">
        <div><div class="pg-title">Comptes Bancaires</div><div class="pg-sub">Gestion des comptes clients STB</div></div>
        <a th:href="@{/comptes/nouveau}" class="btn btn-primary">＋ Nouveau compte</a>
      </div>
      <div class="stats-row">
        <div class="stat-card sc-blue"><div class="si si-blue">🏦</div><div class="stat-val" th:text="${comptes.size()}">0</div><div class="stat-lbl">Total comptes</div></div>
        <div class="stat-card sc-green"><div class="si si-green">💰</div><div class="stat-val" th:text="${#numbers.formatDecimal(totalSoldes/1000,1,0)+'K'}">0K</div><div class="stat-lbl">Total soldes (DT)</div></div>
        <div class="stat-card sc-amber"><div class="si si-amber">✅</div><div class="stat-val" th:text="${comptes.stream().filter(c -> c.statut.name()=='ACTIF').count()}">0</div><div class="stat-lbl">Comptes actifs</div></div>
        <div class="stat-card sc-navy"><div class="si si-navy">🔒</div><div class="stat-lbl" style="margin-top:8px">Accès</div><span class="badge b-info" style="margin-top:6px">ADMIN · COMPTA</span></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Liste des comptes</h3><span class="card-count" th:text="${comptes.size()}+' comptes'"></span></div>
        <div class="tbl-wrap">
          <table th:if="${!#lists.isEmpty(comptes)}">
            <thead><tr><th>N° Compte</th><th>IBAN</th><th>Client</th><th>Type</th><th>Solde</th><th>Devise</th><th>Statut</th><th>Ouverture</th><th style="text-align:center">Actions</th></tr></thead>
            <tbody>
              <tr th:each="c : ${comptes}">
                <td><code style="font-size:11px;color:var(--text3);background:#F1F5F9;padding:2px 7px;border-radius:5px" th:text="${c.numeroCompte}"></code></td>
                <td><code style="font-size:10px;color:var(--text3)" th:text="${c.iban}"></code></td>
                <td style="font-weight:600" th:text="${c.client?.nomComplet ?: '—'}"></td>
                <td><span class="badge b-navy" th:text="${c.typeCompte}"></span></td>
                <td><strong th:text="${#numbers.formatDecimal(c.solde,1,'COMMA',2,'POINT')+' DT'}" th:style="${c.solde < 0 ? 'color:var(--err)' : 'color:var(--ok)'}"></strong></td>
                <td th:text="${c.devise}"></td>
                <td><span th:class="${c.statut.name()=='ACTIF'?'badge b-ok':c.statut.name()=='BLOQUE'?'badge b-err':'badge b-warn'}" th:text="${c.statut}"></span></td>
                <td style="font-size:12px;color:var(--text3)" th:text="${#temporals.format(c.dateOuverture,'dd/MM/yyyy')}"></td>
                <td><div style="display:flex;gap:6px;justify-content:center">
                  <form th:action="@{/comptes/{id}/supprimer(id=${c.id})}" method="post" style="display:inline" onsubmit="return confirm('Supprimer ce compte ?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn-icon del" title="Supprimer">🗑️</button>
                  </form>
                </div></td>
              </tr>
            </tbody>
          </table>
          <div class="empty" th:if="${#lists.isEmpty(comptes)}"><div class="empty-icon">🏦</div><p>Aucun compte</p></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>function tick(){const e=document.getElementById('clock');if(e)e.textContent=new Date().toLocaleTimeString('fr-FR');}setInterval(tick,1000);tick();</script>
</body></html>
