<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>STB — Nouveau virement</title>
  <link rel="stylesheet" th:href="@{/css/stb.css}">
</head>
<body>
<div class="app-layout">
  <div th:replace="~{fragments :: sidebar(activePage='virements', user=${user})}"></div>
  <div class="app-main">
    <div th:replace="~{fragments :: topbar(pageTitle='Nouvel ordre de virement', user=${user})}"></div>
    <div class="page-body">

      <div class="pg-hdr">
        <div>
          <div class="pg-title">Nouvel ordre de virement</div>
          <div class="pg-sub">Transfert bancaire — Comptabilité STB</div>
        </div>
        <a th:href="@{/virements}" class="btn btn-ghost">← Retour</a>
      </div>

      <div class="card" style="max-width:720px">
        <div class="card-head"><h3>↗ Formulaire de virement</h3></div>
        <div class="card-body">
          <form th:action="@{/virements/nouveau}" method="post" th:object="${virement}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-grid">
              <div class="fg span2">
                <label>Compte débiteur *</label>
                <select th:field="*{compteDebiteur}" required>
                  <option value="">-- Sélectionner le compte à débiter --</option>
                  <option th:each="c : ${comptes}"
                          th:value="${c.id}"
                          th:text="${c.numeroCompte + ' — ' + (c.client?.nomComplet ?: 'N/A') + ' | Solde: ' + #numbers.formatDecimal(c.solde,1,'COMMA',2,'POINT') + ' DT'}"></option>
                </select>
              </div>
              <div class="fg">
                <label>Nom du bénéficiaire *</label>
                <input type="text" th:field="*{nomBeneficiaire}" placeholder="Ahmed Ben Ali" required>
              </div>
              <div class="fg">
                <label>IBAN bénéficiaire *</label>
                <input type="text" th:field="*{ibanCrediteur}" placeholder="TN59XXXXXXXXXXXXXXXXXXXX" required>
              </div>
              <div class="fg">
                <label>Montant (DT) *</label>
                <input type="number" th:field="*{montant}" placeholder="1000.00" min="0.01" step="0.01" required>
                <span class="field-err" th:if="${#fields.hasErrors('montant')}" th:errors="*{montant}"></span>
              </div>
              <div class="fg">
                <label>Type de virement</label>
                <select th:field="*{type}">
                  <option th:each="t : ${T(tn.stb.bank.model.Virement.TypeVirement).values()}"
                          th:value="${t}" th:text="${t}"></option>
                </select>
              </div>
              <div class="fg">
                <label>Devise</label>
                <select th:field="*{devise}">
                  <option value="TND">TND — Dinar tunisien</option>
                  <option value="EUR">EUR — Euro</option>
                  <option value="USD">USD — Dollar</option>
                </select>
              </div>
              <div class="fg">
                <label>Frais (DT)</label>
                <input type="number" th:field="*{frais}" placeholder="0.00" min="0" step="0.5">
              </div>
              <div class="fg span2">
                <label>Motif</label>
                <input type="text" th:field="*{motif}" placeholder="Règlement facture, Remboursement prêt…">
              </div>
            </div>
            <div style="background:var(--warn-bg);border:1px solid var(--warn);border-radius:var(--r);padding:12px 16px;margin:18px 0;font-size:13px;color:var(--warn-t)">
              ⚠ Le virement sera soumis à validation avant exécution. Vérifiez bien l'IBAN du bénéficiaire.
            </div>
            <div style="display:flex;gap:10px;justify-content:flex-end">
              <a th:href="@{/virements}" class="btn btn-ghost">Annuler</a>
              <button type="submit" class="btn btn-primary">↗ Soumettre l'ordre</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>
<script>function tick(){const e=document.getElementById('clock');if(e)e.textContent=new Date().toLocaleTimeString('fr-FR');}setInterval(tick,1000);tick();</script>
</body>
</html>
